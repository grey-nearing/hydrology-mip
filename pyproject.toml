[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camels-us-mip"
version = "1.0.0"
description = "HydrologyMIP — Multi-MIP Hydrological Model Intercomparison Platform (Shared Core, Model Zoo, Cloud Zarr Metrics Pipeline, Web Portal, and Registered MIPs starting with CAMELS-US Daily)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Grey S. Nearing" },
    { name = "Daniel Klotz" },
    { name = "Patrick Ebel" },
    { name = "Martin Gauch" },
    { name = "HydrologyMIP Contributors" },
]
# zarr 3 (zarr.config, FsspecStore) requires Python >= 3.11.
requires-python = ">=3.11"
# Core: everything needed by `hydromip`, `mips`, `metrics`, `leaderboards`, and `benchmarks`.
dependencies = [
    "dask>=2024.2",
    "fsspec>=2024.2",
    "gcsfs>=2024.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "xarray>=2024.10",
    "zarr>=3.0,<4",
]

[project.urls]
Homepage = "https://hydrologymip.org"
Repository = "https://github.com/grey-nearing/camels-us-mip"
Issues = "https://github.com/grey-nearing/camels-us-mip/issues"

[project.optional-dependencies]
# Web portal and stateless preview scorer (`web/`).
portal = [
    "fastapi>=0.115",
    "google-auth>=2.28",
    "h5netcdf>=1.3",
    "httpx>=0.27",
    "netCDF4>=1.7",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "uvicorn>=0.30",
]
# Model zoo training/inference (`models/`), including JIT-compiled C++/CUDA extensions.
models = [
    "ninja>=1.11",
    "torch>=2.2",
]
dev = [
    "camels-us-mip[portal,models]",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pyyaml>=6.0.1",
    "ruff>=0.4",
]

[project.scripts]
hydromip = "hydromip.tools.cli:main"
hydromip-package = "hydromip.tools.package_submission:main"
mip-score-model = "metrics.cli:main"
mip-run-model = "models.run_model:main"
mip-update-leaderboard = "leaderboards.update_leaderboard:main"
mip-generate-figures = "leaderboards.generate_figures:main"
benchmark-mip-metrics = "benchmarks.metrics_pipeline:main"

[tool.setuptools.packages.find]
include = ["hydromip*", "mips*", "leaderboards*", "metrics*", "models*", "web*", "benchmarks*"]
exclude = ["*.tests", "*.tests.*", "tests", "tests.*"]

# Non-Python assets that the installed packages resolve at runtime (protocol, splits,
# leaderboards, figures, model catalog, and portal static files). Large data bundles
# (`mips/*/data/*.npz`) are intentionally never packaged.
[tool.setuptools.package-data]
"mips.camels_us_daily" = [
    "protocol.json",
    "splits/*.json",
    "splits/*.txt",
    "splits/*/*.txt",
    "leaderboards/*.json",
    "leaderboards/*.csv",
    "leaderboards/*.md",
    "figures/*.png",
    "figures/*.pdf",
    "figures/*.json",
]
"models" = ["catalog.json"]
"web.portal" = ["*"]
"web.worker" = ["basin_map_metadata.json"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = [
    "hydromip/tests",
    "leaderboards/tests",
    "metrics/tests",
    "models/tests",
    "models/kratzert_lstm/tests",
    "web/tests",
    "benchmarks/tests",
]
markers = [
    "unit: Fast hermetic unit test at native (531, 3652) resolution",
    "integration: Multi-component integration test",
    "e2e: End-to-end pipeline verification test",
    "slow: Long-running test (deselect with -m 'not slow')",
    "gpu: Requires a CUDA-capable GPU",
    "gcs: Requires live Google Cloud Storage credentials and network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E741", "E402"]

[tool.ruff.lint.per-file-ignores]
"mips/*/era_experiments/*.ipynb" = ["F401"]
