[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camels-us-mip"
version = "1.0.0"
description = "HydroMIP — Multi-MIP Hydrological Model Intercomparison Platform (Shared Core, Model Zoo, Cloud Zarr Metrics Pipeline, Web Portal, and Registered MIPs starting with CAMELS-US Daily)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Grey S. Nearing" },
    { name = "Daniel Klotz" },
    { name = "Patrick Ebel" },
    { name = "Martin Gauch" },
    { name = "HydroMIP Contributors" },
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "gcsfs>=2024.2.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "python-multipart>=0.0.9",
    "scipy>=1.12.0",
    "torch>=2.2.0",
    "uvicorn>=0.27.0",
    "xarray>=2024.2.0",
    "zarr>=2.17.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
mip-score-model = "metrics.cli:main"
mip-run-model = "models.run_model:main"
mip-update-leaderboard = "leaderboards.update_leaderboard:main"
mip-generate-figures = "leaderboards.generate_figures:main"
benchmark-mip-metrics = "benchmarks.metrics_pipeline:main"

[tool.setuptools.packages.find]
include = ["hydromip*", "mips*", "leaderboards*", "metrics*", "models*", "frontend*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = [
    "hydromip/tests",
    "leaderboards/tests",
    "metrics/tests",
    "models/tests",
    "models/kratzert_lstm/tests",
    "frontend/tests",
    "benchmarks/tests",
]
markers = [
    "unit: Fast hermetic unit test at native (531, 3652) resolution",
    "integration: Multi-component integration test",
    "e2e: End-to-end pipeline verification test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E741", "E402"]

[tool.ruff.lint.per-file-ignores]
"mips/*/era_experiments/*.ipynb" = ["F401"]

