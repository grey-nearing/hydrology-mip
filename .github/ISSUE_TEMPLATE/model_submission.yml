name: Community Model Submission (CAMELS-US Daily)
description: Submit a new model hydrograph archive (open-source or closed-source) for official scoring and inclusion on HydrologyMIP leaderboards.
title: "[Model Submission] <Model Name> (<leaderboard_id>)"
labels:
  - community-submission
  - pending-review
body:
  - type: markdown
    attributes:
      value: |
        Submit a deterministic daily streamflow archive covering the **531 CAMELS-US benchmark basins** across the canonical Newman evaluation decade (**1989-10-01 to 1999-09-30**, 3,652 daily steps, units `mm/day`).

        Tip: Preview your file first at <https://hydrologymip.org/#contribute> to verify schema alignment, check physical sanity, and auto-generate the submission manifest JSON below.

  - type: dropdown
    id: leaderboard_id
    attributes:
      label: Target Leaderboard (Table 3–14)
      description: Select the spatial generalization and forcing protocol matching your training setup.
      options:
        - gauged__single_camels
        - gauged__multi_camels
        - gauged__lagged_streamflow
        - gauged__freeform
        - pub__single_camels
        - pub__multi_camels
        - pub__lagged_streamflow
        - pub__freeform
        - pur__single_camels
        - pur__multi_camels
        - pur__lagged_streamflow
        - pur__freeform
    validations:
      required: true

  - type: input
    id: model_name
    attributes:
      label: Model Name
      placeholder: e.g. HydroTransformer (10-seed ensemble)
    validations:
      required: true

  - type: input
    id: forcing
    attributes:
      label: Meteorological Forcing Product(s)
      placeholder: e.g. Daymet, Maurer, NLDAS, or Daymet + Maurer + NLDAS
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Submission Category
      options:
        - Contribution
        - MIP Re-run (Our Code)
        - MIP Re-run (Author Code)
      default: 0
    validations:
      required: true

  - type: input
    id: paradigm
    attributes:
      label: Model Paradigm / Category
      placeholder: e.g. Machine learning / Hybrid (ML + Physics) / Conceptual / Process-based
    validations:
      required: true

  - type: input
    id: archive_url
    attributes:
      label: Public Hydrograph Archive DOI or HTTPS URL (Zenodo / HydroShare / OSF / Figshare)
      description: Immutable public archive hosting your `.zarr.zip`, `.nc`, `.csv`, `.parquet`, or `.npz` predictions (pickle files are rejected).
      placeholder: https://doi.org/10.5281/zenodo.XXXXXXX
    validations:
      required: true

  - type: input
    id: code_url
    attributes:
      label: Public Code Repository URL (Leave blank or write Closed-Source if proprietary)
      placeholder: https://github.com/org/repo (or Closed-Source)
    validations:
      required: false

  - type: input
    id: citation
    attributes:
      label: Citation / Reference
      placeholder: Author et al. (2026), Journal / Preprint DOI
    validations:
      required: true

  - type: checkboxes
    id: compliance_rules
    attributes:
      label: Benchmark Compliance Confirmation (All 4 Rules Required)
      options:
        - label: "Rule 1 (Temporal Holdout): Parameters, early stopping, scalers, and losses were never tuned on 1989-10-01 to 1999-09-30."
          required: true
        - label: "Rule 2 (Spatial Holdout): PUB uses canonical 12-fold splits and PUR uses canonical 18 HUC-02 splits (zero target leakage)."
          required: true
        - label: "Rule 3 (Inputs Declared): All meteorological, static, or lagged-streamflow inputs match the declared leaderboard forcing tier."
          required: true
        - label: "Rule 4 (Complete Deterministic Daily Output): Predictions cover all 531 basins and 3,652 days in mm/day with zero NaN masking."
          required: true

  - type: textarea
    id: canonical_manifest
    attributes:
      label: Canonical Submission Manifest JSON (auto-generated by Contribute Step 4)
      description: Paste or keep the JSON exported from Contribute Step 4 (or leave blank if submitting directly).
      render: json
    validations:
      required: false
