name: "Model Submission (Runnable Code in models/)"
description: "Submit a new runnable hydrological model (Contribution) or benchmark reproduction (MIP Re-run) implemented under models/<model_name>/."
title: "[Model Submission]: "
labels: ["model-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing a runnable model to **HydrologyMIP**!
        Use this form alongside your Pull Request adding `models/<model_name>/` (or to coordinate maintainer cloud execution/ingestion of your Zarr hydrograph archive).
        If you are submitting **pre-computed daily hydrographs** from an external or closed-source model without adding code to `models/`, use the **Hydrograph Archive Submission** template instead.

  - type: input
    id: model_name
    attributes:
      label: "Model Display Name & Directory Key"
      description: "Human-readable name and snake_case key under `models/<model_key>/`."
      placeholder: "e.g., HydroGraphNet (`hydro_graph_net`)"
    validations:
      required: true

  - type: dropdown
    id: provenance_type
    attributes:
      label: "Provenance Category"
      options:
        - "Contribution (New model architecture or configuration contributed to HydrologyMIP)"
        - "MIP Re-run (Our Code — Clean-room reproduction of a published paper, with Stage-1 verification)"
        - "MIP Re-run (Author Code — Direct execution of the original authors' open-source repository)"
    validations:
      required: true

  - type: dropdown
    id: model_category
    attributes:
      label: "Architectural Category (Table 2)"
      options:
        - "Machine learning"
        - "Hybrid (ML + Physics)"
        - "Conceptual"
        - "Process-based"
    validations:
      required: true

  - type: input
    id: target_mip
    attributes:
      label: "Target MIP Identifier"
      value: "camels_us_daily"
    validations:
      required: true

  - type: textarea
    id: target_leaderboards
    attributes:
      label: "Target Leaderboard(s) & Ensemble Seeds"
      description: "List each target leaderboard ID (e.g., `gauged__single_camels`, `pub__multi_camels`), forcing product(s), and random seed count (`N`)."
      placeholder: |
        - gauged__single_camels (Daymet, 10 seeds: 101..110)
        - pub__single_camels (Daymet, 10 seeds: 101..110)
    validations:
      required: true

  - type: input
    id: citation_and_doi
    attributes:
      label: "Single Canonical Citation & Paper DOI / URL"
      description: "Cite strictly one canonical paper (or 'Author et al. (2026)' / preprint URL for new contributions)."
      placeholder: "e.g., Jane Doe et al. (2026) — https://doi.org/10.5194/hess-..."
    validations:
      required: true

  - type: input
    id: archive_url
    attributes:
      label: "Public Hydrograph Zarr Archive DOI / URL (Optional if requesting maintainer run)"
      description: "Zenodo / HydroShare / OSF DOI or public URL containing the consolidated `(531, 3652)` Zarr v2 archive(s)."
      placeholder: "https://doi.org/10.5281/zenodo.XXXXXXX"
    validations:
      required: false

  - type: textarea
    id: local_score_summary
    attributes:
      label: "Local `mip-score-model` Output & Stage-1 Summary"
      description: "Paste the JSON summary from local `mip-score-model --bucket-uri ./local_bucket` (and `reproduce_author_metrics.py` Stage-1 comparison if submitting a `MIP Re-run`)."
    validations:
      required: true

  - type: checkboxes
    id: protocol_attestation
    attributes:
      label: "HydrologyMIP Responsible Benchmarking Attestations"
      options:
        - label: "All training, calibration, early stopping, and hyperparameter selection occurred strictly within `1999-10-01` to `2008-09-30` (zero inspection of `1989-10-01` to `1999-09-30`)."
          required: true
        - label: "For PUB/PUR runs, all feature/target scalers and donor weights were fit strictly on `train_basins` inside each fold."
          required: true
        - label: "`models/<model_key>/` loads no split files and hardcodes no Newman dates; all 531 basins have finite predictions (`pred_nan_when_obs_valid == 0`)."
          required: true
        - label: "Code is contributed under `Apache-2.0` (or compatible permissive open-source license documented in `THIRD_PARTY_NOTICES.md`) and hydrographs under `CC-BY-4.0`."
          required: true
