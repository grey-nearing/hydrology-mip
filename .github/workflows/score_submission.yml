name: Score Community Model Submission

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "submissions/**/*.json"
  push:
    branches:
      - main
    paths:
      - "submissions/**/*.json"
  workflow_dispatch:
    inputs:
      submission_file:
        description: "Path to a submission manifest JSON under submissions/"
        required: true
      dry_run:
        description: "Validate and score without uploading Zarr stores to R2/GCS"
        required: false
        default: "false"

# Strictly read-only default permissions (main is protected; no git push from CI).
permissions:
  contents: read

concurrency:
  group: score-submission-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-score:
    name: Validate, Score (14 Metrics) & Verify Leaderboard Parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
          python -m pip install -e ".[dev]" "pydantic>=2.7.0"

      - name: Discover changed submission manifests
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          MANUAL_FILE: ${{ github.event.inputs.submission_file }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess

          manual = os.environ.get("MANUAL_FILE", "").strip()
          if manual:
              files = [manual]
          else:
              event_name = os.environ.get("EVENT_NAME", "").strip()
              base = os.environ.get("BASE_SHA", "").strip()
              head = os.environ.get("HEAD_SHA", "HEAD").strip()
              has_merge_parent = (
                  event_name == "pull_request"
                  and subprocess.run(["git", "rev-parse", "--verify", "HEAD^2"], capture_output=True).returncode == 0
              )
              if has_merge_parent:
                  out = subprocess.check_output(
                      ["git", "diff", "--name-only", "HEAD^1", "HEAD", "--", "submissions/"],
                      text=True,
                  ).splitlines()
              elif base and base != "0" * 40:
                  if subprocess.run(["git", "cat-file", "-e", f"{base}^{{commit}}"]).returncode != 0:
                      subprocess.run(["git", "fetch", "--no-tags", "origin", base], check=False)
                  diff_range = f"{base}...{head}" if event_name == "pull_request" else f"{base}..{head}"
                  out = subprocess.check_output(
                      ["git", "diff", "--name-only", diff_range, "--", "submissions/"],
                      text=True,
                  ).splitlines()
              else:
                  out = subprocess.check_output(
                      ["git", "ls-files", "submissions/"],
                      text=True,
                  ).splitlines()
              files = [f for f in out if f.endswith(".json")]
          print(f"files={json.dumps(files)}")
          print(f"has_files={'true' if files else 'false'}")
          PY

      - name: Run protocol & AST guardrails
        run: python -m hydromip.tools.ci_guardrails --mode all

      - name: Score manifests (dry-run) and verify committed leaderboard parity
        if: steps.discover.outputs.has_files == 'true'
        env:
          HYDROMIP_GCS_ANON: "1"
          SUBMISSION_FILES: ${{ steps.discover.outputs.files }}
          TARGET_OBSERVATIONS_URI: ${{ vars.CAMELS_OBSERVATIONS_URI || 'https://data.hydrologymip.org/camels_us_daily/observations/newman_eval_targets.zarr' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from hydromip.evaluation.zarr_io import open_zarr_store
          from hydromip.tools.process_submission import process_submission
          from metrics.evaluator import GAUCH_2023_METRICS

          files = json.loads(os.environ["SUBMISSION_FILES"])
          local_targets = Path("mips/camels_us_daily/observations/newman_eval_targets.zarr")
          if not local_targets.exists():
              local_targets.parent.mkdir(parents=True, exist_ok=True)
              obs_ds = open_zarr_store(os.environ["TARGET_OBSERVATIONS_URI"])
              obs_ds.to_zarr(str(local_targets), mode="w", consolidated=True, zarr_format=2)

          def _assert_parity(computed: dict, committed: dict, label: str) -> None:
              assert int(committed.get("pred_nan_when_obs_valid", -1)) == 0, f"{label}: NaN masking violation"
              for k in ("primary_ranking_nse", "mean_nse", "med_kge", "nse_le_0"):
                  diff = abs(float(computed[k]) - float(committed[k]))
                  assert diff <= 1e-4, f"{label}: {k} mismatch computed={computed[k]} vs committed={committed[k]}"
              for m in GAUCH_2023_METRICS:
                  c_med = float(computed["gauch_2023_metrics"][m]["median"])
                  m_med = float(committed["gauch_2023_metrics"][m]["median"])
                  assert abs(c_med - m_med) <= 1e-4, f"{label}: {m} median mismatch {c_med} vs {m_med}"

          combined_md = []
          for idx, manifest_file in enumerate(files):
              md_out = Path("staging_reports") / f"summary_{idx}.md"
              res = process_submission(
                  manifest_path=Path(manifest_file),
                  mip_dir=Path("mips/camels_us_daily"),
                  out_zarr_dir=Path("staging_zarr"),
                  summary_md_path=md_out,
                  dry_run=True,
              )
              combined_md.append(md_out.read_text(encoding="utf-8"))

              lb_id = res["entry"]["leaderboard_id"]
              lb_file = Path("mips/camels_us_daily/leaderboards") / f"{lb_id}.json"
              if lb_file.is_file():
                  rows = json.loads(lb_file.read_text(encoding="utf-8")).get("rows", [])
                  by_id = {str(r.get("entry_id")): r for r in rows}
                  eid = res["entry"]["entry_id"]
                  if eid in by_id:
                      _assert_parity(res["entry"], by_id[eid], f"{lb_id}/{eid}")
                      print(f"Verified committed 14-metric parity for {lb_id}/{eid}")
                  if res["ensemble_single_entry"] is not None:
                      seid = res["ensemble_single_entry"]["entry_id"]
                      if seid in by_id:
                          _assert_parity(res["ensemble_single_entry"], by_id[seid], f"{lb_id}/{seid}")
                          print(f"Verified committed 14-metric parity for {lb_id}/{seid}")

          Path("staging_reports").mkdir(exist_ok=True)
          Path("staging_reports/combined_pr_summary.md").write_text(
              "\n---\n\n".join(combined_md), encoding="utf-8"
          )
          PY

      - name: Upload staged Zarr v2 & scoring summary artifact
        if: steps.discover.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-submission-zarr-${{ github.event.pull_request.number || github.run_id }}
          path: |
            staging_zarr/
            staging_reports/combined_pr_summary.md
          if-no-files-found: ignore

  comment-pr-summary:
    name: Post Scoring Summary on Non-Fork PR
    needs: validate-and-score
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download scoring summary artifact
        uses: actions/download-artifact@v4
        with:
          name: canonical-submission-zarr-${{ github.event.pull_request.number || github.run_id }}
          path: downloaded_report

      - name: Post summary comment
        if: hashFiles('downloaded_report/combined_pr_summary.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "${PR_NUMBER}" --body-file downloaded_report/combined_pr_summary.md

  publish-on-main:
    name: Publish Merged Submission Zarr v2 Archive to R2/GCS
    needs: validate-and-score
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
          python -m pip install -e ".[dev]" "pydantic>=2.7.0"

      - name: Materialize Zarr v2 from merged manifests (no push to main)
        env:
          HYDROMIP_GCS_ANON: "1"
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          MANUAL_FILE: ${{ github.event.inputs.submission_file }}
          TARGET_OBSERVATIONS_URI: ${{ vars.CAMELS_OBSERVATIONS_URI || 'https://data.hydrologymip.org/camels_us_daily/observations/newman_eval_targets.zarr' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from hydromip.evaluation.zarr_io import open_zarr_store
          from hydromip.tools.process_submission import process_submission

          manual = os.environ.get("MANUAL_FILE", "").strip()
          if manual:
              files = [manual]
          else:
              import subprocess
              base = os.environ.get("BASE_SHA", "").strip()
              head = os.environ.get("HEAD_SHA", "HEAD").strip()
              if base and base != "0" * 40:
                  if subprocess.run(["git", "cat-file", "-e", f"{base}^{{commit}}"]).returncode != 0:
                      subprocess.run(["git", "fetch", "--no-tags", "origin", base], check=False)
                  out = subprocess.check_output(
                      ["git", "diff", "--name-only", base, head, "--", "submissions/"],
                      text=True,
                  ).splitlines()
              else:
                  out = subprocess.check_output(["git", "ls-files", "submissions/"], text=True).splitlines()
              files = [f for f in out if f.endswith(".json")]

          if not files:
              print("No submission manifests changed; exiting.")
              raise SystemExit(0)

          local_targets = Path("mips/camels_us_daily/observations/newman_eval_targets.zarr")
          if not local_targets.exists():
              local_targets.parent.mkdir(parents=True, exist_ok=True)
              obs_ds = open_zarr_store(os.environ["TARGET_OBSERVATIONS_URI"])
              obs_ds.to_zarr(str(local_targets), mode="w", consolidated=True, zarr_format=2)

          for idx, manifest_file in enumerate(files):
              process_submission(
                  manifest_path=Path(manifest_file),
                  mip_dir=Path("mips/camels_us_daily"),
                  out_zarr_dir=Path("staging_zarr"),
                  summary_md_path=Path(f"staging_reports/main_{idx}.md"),
                  dry_run=True,
              )
          PY

      - name: Upload Zarr v2 & refreshed manifest_index.json to R2/GCS
        env:
          GCS_HYDROGRAPH_BUCKET: ${{ vars.GCS_HYDROGRAPH_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [[ -n "${GCS_HYDROGRAPH_BUCKET:-}" && -d "staging_zarr/hydrographs" ]]; then
            gsutil -m rsync -r staging_zarr/hydrographs "${GCS_HYDROGRAPH_BUCKET%/}/hydrographs"
          fi
          if [[ -n "${R2_ENDPOINT:-}" && -n "${R2_BUCKET:-}" && -n "${R2_ACCESS_KEY_ID:-}" && -n "${R2_SECRET_ACCESS_KEY:-}" && -d "staging_zarr/hydrographs" ]]; then
            python -m pip install --quiet botocore
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          import botocore.session
          from botocore.config import Config
          from leaderboards.update_leaderboard import build_hydrograph_manifest

          def content_type_for(fp: Path) -> str:
              name = fp.name
              suf = fp.suffix.lower()
              if name in (".zmetadata", ".zattrs", ".zarray", ".zgroup") or suf == ".json":
                  return "application/json"
              return "application/octet-stream"

          root = Path("staging_zarr/hydrographs")
          client = botocore.session.get_session().create_client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(s3={"addressing_style": "path"}),
          )
          bucket = os.environ["R2_BUCKET"]
          uploaded = 0
          for fp in sorted(p for p in root.rglob("*") if p.is_file()):
              rel = fp.relative_to(root).as_posix()
              key = f"camels_us_daily/hydrographs/{rel}"
              client.put_object(
                  Bucket=bucket,
                  Key=key,
                  Body=fp.read_bytes(),
                  CacheControl="public, max-age=86400",
                  ContentType=content_type_for(fp),
              )
              uploaded += 1

          raw_manifest = build_hydrograph_manifest(
              bucket_uri="gs://camels-us-mip",
              leaderboards_dir=Path("mips/camels_us_daily/leaderboards"),
          )
          public_stores = []
          for s in raw_manifest["stores"]:
              rel = s["zarr_uri"].removeprefix("gs://camels-us-mip/").rstrip("/")
              public_stores.append({**s, "zarr_uri": f"https://data.hydrologymip.org/camels_us_daily/{rel}"})
          public_manifest = {
              **raw_manifest,
              "bucket": "https://data.hydrologymip.org/camels_us_daily",
              "stores": public_stores,
          }
          client.put_object(
              Bucket=bucket,
              Key="camels_us_daily/hydrographs/manifest_index.json",
              Body=(json.dumps(public_manifest, indent=2) + "\n").encode("utf-8"),
              CacheControl="public, max-age=86400",
              ContentType="application/json",
          )
          print(f"Uploaded {uploaded} Zarr files and updated manifest_index.json ({len(public_stores)} stores) in R2 s3://{bucket}/camels_us_daily/hydrographs/")
          PY
          elif [[ -z "${GCS_HYDROGRAPH_BUCKET:-}" ]]; then
            echo "No cloud hydrograph bucket configured; skipping remote Zarr upload."
          fi
