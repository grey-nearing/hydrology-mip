name: Regenerate Leaderboard Bundle and Figures

on:
  workflow_dispatch:
    inputs:
      mip_id:
        description: "Optional MIP ID (leave blank to sync all registered MIPs)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: regenerate-figures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-figures:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
          python -m pip install -e ".[dev]" "pytest-xdist>=3.5.0"

      - name: Synchronize master tables and regenerate figures
        env:
          MIP_ID: ${{ inputs.mip_id }}
        run: |
          bash leaderboards/on_community_commit.sh

      - name: Run leaderboard and core verification tests
        run: |
          pytest hydromip/tests leaderboards/tests -n auto -q

      - name: Open pull request if figures or master tables changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add "mips/*/leaderboards/tables_3_to_14.json" "mips/*/figures/"
          if git diff --cached --quiet; then
            echo "All master tables and figures are already up to date."
            exit 0
          fi
          BRANCH="chore/sync-figures-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git commit -m "chore(figures): synchronize master tables and paper figures"
          git push -u origin "${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore(figures): synchronize master tables and paper figures" \
            --body "Automated synchronization of \`tables_3_to_14.json\` and \`figures/\` triggered via \`workflow_dispatch\`."
