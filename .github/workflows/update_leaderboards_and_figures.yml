name: Update Leaderboards and Paper Figures on Community Commit

on:
  push:
    branches:
      - main
    paths:
      - "mips/*/leaderboards/**"
      - "mips/*/protocol.json"
      - "leaderboards/**"
      - "hydromip/**"
      - "submissions/**"
  pull_request:
    paths:
      - "mips/**"
      - "leaderboards/**"
      - "hydromip/**"
      - "submissions/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-figures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Synchronize leaderboard JSON bundle and regenerate paper figures
        run: |
          bash leaderboards/on_community_commit.sh

      - name: Run core, leaderboard, and figure unit tests
        run: |
          pytest hydromip/tests leaderboards/tests -q

      - name: Commit updated figures if changed on push to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mips/camels_us_daily/leaderboards/tables_3_to_14.json mips/camels_us_daily/figures/
          if ! git diff --cached --quiet; then
            git commit -m "chore(figures): regenerate paper figures from updated leaderboard JSONs [skip ci]"
            git push
          fi
