name: Convert Submission Issue to Pull Request

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: issue-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  open-submission-pr:
    name: Score Submission & Create PR from Issue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    if: >-
      !github.event.issue.pull_request && (
        (github.event.action == 'opened' && (
          contains(github.event.issue.labels.*.name, 'community-submission') ||
          (contains(github.event.issue.body, '"schema_version"') && contains(github.event.issue.body, '"leaderboard_id"'))
        )) ||
        (github.event.action == 'labeled' && github.event.label.name == 'community-submission')
      )
    steps:
      - name: Acknowledge submission and ensure labels
        id: ack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          repo = os.environ["REPO"]
          action = os.environ["EVENT_ACTION"]
          issue_num = os.environ["ISSUE_NUMBER"]
          run_url = os.environ["RUN_URL"]

          # Deduplicate template-triggered `labeled` events that fire alongside `opened`.
          if action == "labeled":
              issue_json = json.loads(
                  subprocess.check_output(
                      ["gh", "issue", "view", issue_num, "--repo", repo, "--json", "comments"],
                      text=True,
                  )
              )
              comments = issue_json.get("comments") or []
              last_ack = None
              last_fail = None
              pr_opened_marker = False
              for c in comments:
                  body = c.get("body") or ""
                  ts = c.get("createdAt") or ""
                  if "<!-- hydromip-submission-ack -->" in body:
                      last_ack = ts
                  if "<!-- hydromip-submission-failed -->" in body:
                      last_fail = ts
                  if "<!-- hydromip-submission-pr-opened -->" in body:
                      pr_opened_marker = True
              if pr_opened_marker and (not last_fail or (last_ack and last_ack > last_fail)):
                  open_prs = json.loads(
                      subprocess.check_output(
                          ["gh", "pr", "list", "--repo", repo, "--state", "open", "--search", f"Closes #{issue_num} in:body", "--json", "number"],
                          text=True,
                      )
                  )
                  if open_prs:
                      print("skip=true")
                      raise SystemExit(0)
              if last_ack and (not last_fail or last_ack > last_fail):
                  ack_dt = datetime.fromisoformat(last_ack.replace("Z", "+00:00"))
                  age_sec = (datetime.now(timezone.utc) - ack_dt).total_seconds()
                  if age_sec < 600:
                      print("skip=true")
                      raise SystemExit(0)

          # Use GITHUB_TOKEN so adding labels does not recursively re-trigger this workflow.
          subprocess.run(
              ["gh", "issue", "edit", issue_num, "--repo", repo, "--add-label", "community-submission,pending-review"],
              check=False,
          )
          ack_body = (
              "<!-- hydromip-submission-ack -->\n"
              "Thanks for submitting your model to **HydrologyMIP**! Automated verification has started.\n\n"
              f"- **Live progress log:** {run_url}\n\n"
              "### What happens next\n"
              "1. **Automated scoring (~3–5 min):** GitHub Actions downloads your public archive, verifies the 531-basin alignment and physical sanity checks, computes all 14 Gauch et al. (2023) metrics, and updates the leaderboard tables and figures.\n"
              "2. **Automated Pull Request:** Once scoring passes, a Pull Request is opened automatically and linked back on this issue for CI checks and maintainer review.\n"
              "3. **Review & publication:** After a maintainer approves and merges the Pull Request, your model goes live on https://hydrologymip.org/ and its standardized Zarr v2 hydrograph archive is mirrored to https://data.hydrologymip.org/.\n\n"
              "No further action is needed from you right now — GitHub will notify you on this issue when the Pull Request is ready or if anything needs attention.\n"
          )
          subprocess.run(
              ["gh", "issue", "comment", issue_num, "--repo", repo, "--body", ack_body],
              check=True,
          )
          print("skip=false")
          PY

      - name: Checkout repository
        if: steps.ack.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PR_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        if: steps.ack.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install scoring dependencies
        if: steps.ack.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
          python -m pip install -e ".[dev]" "pydantic>=2.7.0"

      - name: Parse manifest, score (14 metrics), update leaderboards/figures, and open PR
        if: steps.ack.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          HYDROMIP_GCS_ANON: "1"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          TARGET_OBSERVATIONS_URI: ${{ vars.CAMELS_OBSERVATIONS_URI || 'https://data.hydrologymip.org/camels_us_daily/observations/newman_eval_targets.zarr' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from hydromip.evaluation.zarr_io import open_zarr_store

          body = os.environ.get("ISSUE_BODY") or ""
          json_matches = re.findall(r"```json\s*\n(.*?)\n```", body, flags=re.DOTALL | re.IGNORECASE)
          manifest = None
          for blk in reversed(json_matches):
              candidate = json.loads(blk)
              if isinstance(candidate, dict) and candidate.get("leaderboard_id") and candidate.get("model_name"):
                  manifest = candidate
                  break

          if manifest is None:
              sections = {}
              cur_key = None
              buf = []
              for line in body.splitlines():
                  if line.startswith("### "):
                      if cur_key:
                          sections[cur_key] = "\n".join(buf).strip()
                      cur_key = line[4:].strip()
                      buf = []
                  else:
                      buf.append(line)
              if cur_key:
                  sections[cur_key] = "\n".join(buf).strip()

              lb_id = (
                  sections.get("Target Leaderboard")
                  or sections.get("Target Leaderboard (Table 3–14)", "")
              ).strip()
              model_name = sections.get("Model Name", "").strip()
              opt_entry_id = sections.get("Entry ID (Optional)", "").strip()
              opt_family_id = sections.get("Model Family ID (Optional)", "").strip()
              if opt_entry_id.lower() in ("_no response_", "none", "n/a"):
                  opt_entry_id = ""
              if opt_family_id.lower() in ("_no response_", "none", "n/a"):
                  opt_family_id = ""
              archive_url = sections.get(
                  "Public Hydrograph Archive DOI or HTTPS URL (Zenodo / HydroShare / OSF / Figshare)", ""
              ).strip()
              code_url = sections.get(
                  "Public Code Repository URL (Leave blank or write Closed-Source if proprietary)",
                  sections.get("Public Code Repository URL", ""),
              ).strip()
              is_closed = code_url.lower() in ("", "none", "n/a", "closed-source", "_no response_")
              manifest = {
                  "schema_version": "1.1",
                  "benchmark": "camels_us_daily",
                  "leaderboard_id": lb_id,
                  "model_name": model_name,
                  "entry_id": opt_entry_id or None,
                  "family_id": opt_family_id or None,
                  "forcing": sections.get("Meteorological Forcing Product(s)", "Daymet").strip(),
                  "category": sections.get("Submission Category", "Contribution").strip(),
                  "paradigm": sections.get(
                      "Model Paradigm / Category",
                      sections.get("Model Paradigm / Family", "Machine learning"),
                  ).strip(),
                  "archive_url": archive_url,
                  "code_url": "" if is_closed else code_url,
                  "closed_source": is_closed,
                  "citation": sections.get("Citation / Reference", "Community Contribution (2026)").strip(),
                  "compliance_attestation": {
                      "blind_holdout_window": True,
                      "strict_spatial_holdout_folds": True,
                      "all_forcing_inputs_declared": True,
                      "deterministic_daily_predictions_mm_per_day": True,
                  },
              }

          lb_id = str(manifest["leaderboard_id"]).strip()
          if not re.fullmatch(r"(gauged|pub|pur)__(single_camels|multi_camels|lagged_streamflow|freeform)", lb_id):
              raise ValueError(f"Unsupported leaderboard_id {lb_id!r}")

          model_name = str(manifest["model_name"]).strip()
          issue_num = int(os.environ["ISSUE_NUMBER"])
          issue_author = os.environ.get("ISSUE_AUTHOR", "").strip()

          raw_eid = str(manifest.get("entry_id") or "").strip()
          if raw_eid and ".." not in raw_eid and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", raw_eid):
              entry_id = raw_eid
          else:
              slug = re.sub(r"[^a-z0-9_]+", "_", model_name.lower()).strip("_")[:32] or "model"
              entry_id = f"contrib_{slug}_gh{issue_num}"

          manifest["entry_id"] = entry_id
          manifest["submitted_by_github"] = issue_author
          manifest["source_issue"] = issue_num

          sub_path = Path("submissions") / lb_id / f"{entry_id}.json"
          sub_path.parent.mkdir(parents=True, exist_ok=True)
          sub_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          local_targets = Path("mips/camels_us_daily/observations/newman_eval_targets.zarr")
          if not local_targets.exists():
              local_targets.parent.mkdir(parents=True, exist_ok=True)
              obs_ds = open_zarr_store(os.environ["TARGET_OBSERVATIONS_URI"])
              obs_ds.to_zarr(str(local_targets), mode="w", consolidated=True, zarr_format=2)

          summary_path = Path("staging_reports/summary.md")
          subprocess.run(
              [
                  "python",
                  "-m",
                  "hydromip.tools.process_submission",
                  "--manifest",
                  sub_path.as_posix(),
                  "--mip-dir",
                  "mips/camels_us_daily",
                  "--out-zarr-dir",
                  "staging_zarr",
                  "--summary-md",
                  summary_path.as_posix(),
                  "--update-figures",
              ],
              check=True,
          )
          summary_md = summary_path.read_text(encoding="utf-8")

          branch = f"submissions/{entry_id}"
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "checkout", "-B", branch], check=True)
          subprocess.run(
              [
                  "git",
                  "add",
                  sub_path.as_posix(),
                  "mips/camels_us_daily/leaderboards/",
                  "mips/camels_us_daily/figures/",
              ],
              check=True,
          )
          subprocess.run(
              ["git", "commit", "-m", f"feat(submission): score & register {model_name} for {lb_id} (#{issue_num})"],
              check=True,
          )
          subprocess.run(["git", "push", "-u", "--force", "origin", branch], check=True)

          pr_body = (
              f"Automated submission PR opened from issue #{issue_num} by @{issue_author}.\n\n"
              f"Closes #{issue_num}\n\n"
              f"---\n\n{summary_md}"
          )
          existing_prs = json.loads(
              subprocess.check_output(
                  ["gh", "pr", "list", "--head", branch, "--state", "open", "--json", "number,url"],
                  text=True,
              )
          )
          if existing_prs:
              pr_num = str(existing_prs[0]["number"])
              pr_url = existing_prs[0]["url"]
              subprocess.run(["gh", "pr", "edit", pr_num, "--body", pr_body], check=True)
          else:
              pr_url = subprocess.check_output(
                  [
                      "gh",
                      "pr",
                      "create",
                      "--base",
                      "main",
                      "--head",
                      branch,
                      "--title",
                      f"Community Submission: {model_name} ({lb_id})",
                      "--body",
                      pr_body,
                  ],
                  text=True,
              ).strip()

          closing_body = (
              "<!-- hydromip-submission-pr-opened -->\n"
              f"Automated scoring succeeded and opened Pull Request {pr_url} for maintainer review.\n\n"
              "### Next steps\n"
              "- Automated CI and scoring parity checks are now running on the Pull Request.\n"
              "- Once a maintainer approves and merges the Pull Request, your model will go live on "
              "https://hydrologymip.org/ and its standardized Zarr v2 archive will be mirrored to "
              "https://data.hydrologymip.org/.\n"
              "- No further action is needed from you unless a reviewer requests a change."
          )
          subprocess.run(
              [
                  "gh",
                  "issue",
                  "comment",
                  str(issue_num),
                  "--body",
                  closing_body,
              ],
              check=True,
          )
          PY

      - name: Notify contributor on automated failure
        if: failure() && steps.ack.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body $'<!-- hydromip-submission-failed -->\nAutomated submission processing failed — please inspect the workflow logs for schema/DOI or compliance diagnostics: '"${RUN_URL}"
