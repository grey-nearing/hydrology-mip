name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

# Strictly read-only permissions across all PR test execution (fork-safe).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-guardrails:
    name: Lint & AST Protocol Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fast lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.4.0" "pyyaml>=6.0.1"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run guardrail self-tests
        run: python -m hydromip.tools.ci_guardrails --self-test

      - name: Run AST, anti-leakage, pickle-safety, secret, and binary-size guardrails
        run: python -m hydromip.tools.ci_guardrails --mode code-guardrails

  docs-and-registry-integrity:
    name: Docs, Metadata & Leaderboard Bijection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyyaml>=6.0.1"

      - name: Verify Markdown links, CITATION.cff/.zenodo.json, skills layout, and cross-registry invariants
        run: python -m hydromip.tools.ci_guardrails --mode docs-and-registry

  packaging-and-container-smoke:
    name: Wheel Packaging & Clean-Venv Import Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Build wheel and verify packaged non-Python assets
        run: |
          python -m pip install --upgrade pip wheel "setuptools>=77.0"
          python -m pip wheel --no-deps --no-build-isolation . -w /tmp/dist
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("/tmp/dist").glob("*.whl"))
          assert len(wheels) == 1, f"Expected 1 wheel in /tmp/dist, found {wheels}"
          with zipfile.ZipFile(wheels[0]) as zf:
              members = set(zf.namelist())
          required_assets = (
              "mips/camels_us_daily/protocol.json",
              "mips/camels_us_daily/splits/basins_531.txt",
              "mips/camels_us_daily/leaderboards/table_2_registry.json",
              "models/catalog.json",
          )
          missing = [a for a in required_assets if a not in members]
          assert not missing, f"Wheel is missing required data assets: {missing}"
          leaked_npz = [m for m in members if m.endswith(".npz")]
          assert not leaked_npz, f"Wheel unexpectedly packaged .npz binary blobs: {leaked_npz}"
          print(f"Verified wheel {wheels[0].name} ({len(members)} entries).")
          PY

      - name: Install built wheel in isolated venv and verify non-editable runtime imports
        run: |
          python -m venv /tmp/wheel_venv
          /tmp/wheel_venv/bin/python -m pip install --upgrade pip
          /tmp/wheel_venv/bin/python -m pip install /tmp/dist/*.whl
          cd /tmp
          /tmp/wheel_venv/bin/python -c "import hydromip, metrics, leaderboards, benchmarks; assert len(leaderboards.load_all_leaderboards()['leaderboards']) == 12; print('OK')"

  unit-and-protocol-tests:
    name: Tests (${{ matrix.shard_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_name: core-metrics-benchmarks
            test_targets: "hydromip/tests metrics/tests benchmarks/tests"
          - shard_name: models-zoo
            test_targets: "models/tests models/kratzert_lstm/tests"
          - shard_name: leaderboards
            test_targets: "leaderboards/tests"
          - shard_name: frontend
            test_targets: "frontend/tests"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only PyTorch and project dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
          python -m pip install -e ".[dev]" "pytest-xdist>=3.5.0"

      - name: Execute native-resolution (531 x 3652) test shard
        env:
          HYDROMIP_GCS_ANON: "1"
        run: |
          if [[ "${{ matrix.shard_name }}" == "frontend" ]]; then
            if [[ -d frontend/tests ]]; then
              pytest frontend/tests -n auto --dist worksteal --maxfail=5 -v
            elif [[ -d web/tests ]]; then
              pytest web/tests -n auto --dist worksteal --maxfail=5 -v
            elif [[ -d web ]]; then
              echo "Legacy frontend/tests absent and web/ present; skipping legacy frontend pytest shard."
            else
              echo "::error::Neither frontend/tests nor web/ directory found."
              exit 1
            fi
          else
            pytest ${{ matrix.test_targets }} -n auto --dist worksteal --maxfail=5 -v
          fi

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - lint-and-guardrails
      - docs-and-registry-integrity
      - packaging-and-container-smoke
      - unit-and-protocol-tests
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all upstream CI & protocol checks succeeded
        run: |
          echo "lint-and-guardrails:           ${{ needs.lint-and-guardrails.result }}"
          echo "docs-and-registry-integrity:   ${{ needs.docs-and-registry-integrity.result }}"
          echo "packaging-and-container-smoke: ${{ needs.packaging-and-container-smoke.result }}"
          echo "unit-and-protocol-tests:       ${{ needs.unit-and-protocol-tests.result }}"
          if [[ "${{ needs.lint-and-guardrails.result }}" != "success" ]] || \
             [[ "${{ needs.docs-and-registry-integrity.result }}" != "success" ]] || \
             [[ "${{ needs.packaging-and-container-smoke.result }}" != "success" ]] || \
             [[ "${{ needs.unit-and-protocol-tests.result }}" != "success" ]]; then
            echo "::error::One or more required HydrologyMIP CI checks failed or were cancelled."
            exit 1
          fi
          echo "All HydrologyMIP CI checks passed."
